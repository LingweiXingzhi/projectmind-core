}.panel p,.panel pre,.copy-text{white-space:pre-wrap;font-size:13px;line-height:1.9;overflow-wrap:anywhere;color:#565660;margin:0}.panel pre{font:12px/1.8 ui-monospace,monospace;max-height:380px;overflow:auto;padding:15px;background:#f5f5f7;border-radius:9px}.hint{font-size:12px;color:#86868b;line-height:1.8;margin:10px 0;white-space:pre-wrap}.notice{padding:13px 16px;border:1px solid #e7dfcb;border-radius:10px;background:#fffaf0;color:#8f7850;font-size:12px;line-height:1.8;margin:16px 0}.check-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #ececf0;align-items:flex-start}.check-row:last-child{border:0}.check-row .check-body{flex:1;min-width:0}.check-row strong{font-size:13px;font-weight:550;line-height:1.7}.check-row select{width:100px;padding:7px;font-size:11px}.check-row textarea{font-size:12px;min-height:55px;margin-top:8px}.check-row input{font-size:12px;margin-top:8px;padding:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:block;font-size:12px;color:#777782;margin-bottom:16px}.field input,.field textarea,.field select{margin-top:8px}.field.wide{grid-column:1/-1}.field.title input{font-size:23px;font-weight:600}.choice{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.8;margin:10px 0;color:#5e5e68}.choice input{width:auto;margin-top:4px;accent-color:#0071e3}.choice small{color:#86868b}.log-list{max-height:300px;overflow:auto}.log-item{padding:10px 0;border-bottom:1px solid #eee}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.empty{min-height:440px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.empty span{font-size:40px;color:#a6bbd2}.empty h1{font-size:30px;margin:20px 0 10px}.empty p{max-width:440px;color:#86868b;font-size:14px;line-height:1.9}.empty .buttons{display:flex;gap:10px;margin-top:20px}.event{border-left:2px solid #dee7f0;padding:0 0 20px 18px;margin-left:5px}.event strong{font-size:12px}.event p{font-size:13px;line-height:1.8;white-space:pre-wrap;margin:9px 0;color:#565660}.event small{font-size:11px;color:#86868b}.export-bar{display:flex;gap:9px;flex-wrap:wrap}.file-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ececf0;font-size:12px;overflow-wrap:anywhere}.file-row button{margin-left:auto;flex-shrink:0;padding:6px 9px;font-size:10px}details{margin:12px 0}summary{cursor:pointer;color:#696974;font-size:12px;line-height:1.8}iframe.pdf{width:100%;height:60vh;border:0;margin-top:20px}.status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:92vw;background:#252527;color:#fff;box-shadow:0 5px 25px #0002;font-size:13px;line-height:1.8;padding:12px 20px;border-radius:13px;z-index:10}.status:empty{display:none}dialog{width:min(820px,90vw);max-height:85vh;border:1px solid #dddde3;border-radius:18px;padding:26px;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0004;backdrop-filter:blur(4px)}dialog pre{white-space:pre-wrap;font:12px/1.8 ui-monospace,monospace;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:space-between;align-items:center}.inspection-line{display:flex;gap:15px;justify-content:space-between;align-items:flex-start;font-size:12px;padding:12px 0;border-bottom:1px solid #eee}.inspection-line span{color:#86868b;flex-shrink:0}.inspection-line strong{font-weight:500;overflow-wrap:anywhere;text-align:right}.success{color:#307b60}.warning{color:#a57535}.muted{color:#86868b}.badge-note{padding:4px 8px;background:#f1f1f5;border-radius:6px;font-size:10px;display:inline-block;color:#86868b}@media(max-width:960px){.layout{grid-template-columns:250px minmax(0,1fr)}main{padding:28px 22px}.grid,.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:650px){header{padding:16px 18px;align-items:flex-start}.links{gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:170px;font-size:10px}.brand{font-size:18px}.layout{grid-template-columns:1fr}aside{padding:20px;border-right:0;border-bottom:1px solid #dddde4}#records{max-height:230px;overflow:auto}.actor{margin:15px 0;display:grid;grid-template-columns:1fr 110px;gap:10px}.actor small{grid-column:1/-1;margin:0}main{padding:25px 20px}.empty{min-height:320px}.empty h1{font-size:26px}.topline{gap:7px}h1{font-size:25px}.check-row{flex-direction:column}.check-row select{width:100%}.check-body{width:100%}.next-card{padding:20px}.inspection-line{flex-direction:column;gap:7px}.inspection-line strong{text-align:left}}

</style></head><body>
<header><div class="brand">协同交接 · GitHub 实验版<small>从停下的位置，继续正确的工作</small></div><nav class="links"><a href="/">项目地图</a><button id="reference-workspace" class="quiet">工作项索引</button><button id="experimental-logs" class="quiet">实验工作日志</button><a href="/ext/continuity">原协同交接</a><a href="/ext/handoff">原交接包</a></nav></header>
<div class="layout"><aside><div class="side-actions"><button id="new" class="primary">＋ 保存接续点</button><button id="import">接手文件</button></div><input id="import-file" type="file" accept=".json" hidden><div class="actor"><label>当前记录者<input id="actor" placeholder="姓名或 AI 工具名称" maxlength="100"></label><select id="origin" aria-label="反馈来源"><option value="human">人工反馈</option><option value="ai">AI 反馈</option></select><small>名称由填写者声明。记录保存在本机，跨设备通过文件交换。</small></div><input id="search" placeholder="搜索任务或目标" aria-label="搜索接续记录"><div class="filters" id="filters"></div><div id="records"></div></aside><main id="main"></main></div><div id="status" class="status" role="status" aria-live="polite"></div><dialog id="detail"><div class="dialog-actions"><h2 id="detail-title"></h2><button id="close-detail">关闭</button></div><div id="detail-content"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),API='/api/extensions/continuity_github';
const stateLabels={draft:'未接手',ready:'待接手',receiving:'待接手',active:'工作中',blocked:'问题待处理',completed:'任务已完成'};
const provenanceLabels={participant_report:'参与者记录',contributor_record:'记录者填写',ai_candidate:'AI 候选，待核实'};
const kinds={ready:'交接资料已准备',receive:'开始查看交接',start:'开始工作',claim:'接手工作',block:'记录问题 · 影响继续工作',resume:'继续工作',finish_session:'结束本次接手',complete:'任务完成',question:'记录问题',note:'记录进展'};
const reviews={materials:'已找到必要材料；缺失部分有明确处理方式',environment:'已尝试运行 / 验证，或明确本次不需要运行的依据',understanding:'已理解目标、停止位置，以及尚未核实的内容',nextStep:'已明确接下来第一步怎么做和怎样验证'};
let records=[],config=null,selected=null,tab='overview',filter='all',editing=false,dirty=false,busy=false,ticket=0,urls=[],workAction='note';
const n=(tag,value,cls)=>{const node=document.createElement(tag);if(value!==undefined)node.textContent=value;if(cls)node.className=cls;return node;};
let messageTimer;
function msg(value){clearTimeout(messageTimer);$('status').textContent=value;messageTimer=setTimeout(()=>{$('status').textContent='';},5000);}
async function get(action,params={}){const r=await fetch(API+'?'+new URLSearchParams({action,...params}));const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d;}
async function post(action,data){const body=JSON.stringify({action,...data});if(new TextEncoder().encode(body).length>65536)throw Error('单次保存内容超过上限。请缩短说明，或使用 JSON 文件导入。');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d;}
function actor(){return {actor:$('actor').value.trim(),origin:$('origin').value};}
function leave(){return !busy&&(!dirty||confirm('有尚未保存的内容，确定放弃吗？'));}
function revoke(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
function btn(label,handler,cls){const b=n('button',label,cls);b.onclick=handler;return b;}
function paragraph(label,value){const p=n('section',undefined,'panel');p.append(n('h3',label),n('p',value||'未填写'));return p;}
function time(value){return new Date(value).toLocaleString('zh-CN',{hour12:false});}
async function lock(fn){if(busy)return;busy=true;const nodes=[...document.querySelectorAll('button,input,select,textarea')].map(x=>[x,x.disabled]);nodes.forEach(([x])=>x.disabled=true);try{await fn();}catch(e){msg(e.message);}finally{busy=false;nodes.forEach(([x,old])=>x.disabled=old);}}
async function refreshList(){records=(await get('list')).records;renderList();}
function renderList(){const query=$('search').value.toLowerCase();$('filters').replaceChildren();for(const [key,label] of [['all','全部'],['draft','准备'],['ready','待接手'],['active','进行中'],['blocked','遇到问题']])$('filters').append(btn(label,()=>{filter=key;renderList();},key===filter?'active':''));$('records').replaceChildren();const visible=records.filter(r=>(filter==='all'||r.state===filter||filter==='active'&&r.state==='receiving')&&[r.title,r.goal,r.owner].join(' ').toLowerCase().includes(query));for(const r of visible){const b=btn('',()=>open(r.id),'record-card'+(selected?.id===r.id?' active':''));b.append(n('strong',r.title),n('p',r.goal||'尚未填写目标'),n('span',stateLabels[r.state],'pill '+r.state),n('p',(r.checkCount?'清单 '+r.doneCount+'/'+r.checkCount+' · ':'')+'日志 '+r.logCount+' · 第 '+r.version+' 版'),n('small',time(r.updatedAt)));$('records').append(b);}if(!visible.length)$('records').append(n('p',query?'没有匹配的任务':'暂无记录。保存接续点或导入收到的 JSON。','hint'));}
function empty(){revoke();const box=n('div',undefined,'empty');box.append(n('span','↗'),n('h1','工作停下来，理解留下来'),n('p','保存任务停在哪里、已有改动和下一步。回来继续，或交给队友、新 AI，先检查再接着做。'));const buttons=n('div',undefined,'buttons');buttons.append(btn('保存当前接续点',()=>newRecord(),'primary'),btn('接手已有交接文件',()=>$('import-file').click()));box.append(buttons,n('p','原交接包与工作日志仍各自可用，不需要把日常沟通搬到这里。','hint'));$('main').replaceChildren(box);}
async function open(id){if(!leave())return;const current=++ticket;try{const r=(await get('get',{id})).record;if(current!==ticket)return;selected=r;editing=dirty=false;tab='overview';renderList();render();}catch(e){msg(e.message);}}
function render(){revoke();const r=selected;$('main').replaceChildren();const top=n('div',undefined,'topline');top.append(n('span',stateLabels[r.state],'pill '+r.state),n('span','第 '+r.version+' 版','badge-note'),n('span',undefined,'spacer'));if(r.state!=='completed')top.append(btn('编辑 / 更新接续点',()=>editRecord(),'quiet'));top.append(btn('建立下一次接续',()=>followup(),'quiet'));$('main').append(top,n('h1',r.task.title),n('p',(r.task.owner?'发起记录者 '+r.task.owner+' · ':'')+'更新于 '+time(r.updatedAt)+' · 保存时提交 '+r.handoff.codeRevision,'sub'));const tabs=n('div',undefined,'tabs');for(const [key,label] of [['overview','接续摘要'],['receive','接手与反馈'],['materials','证据与日志'],['history','历史与导出']])tabs.append(btn(label,()=>{if(!leave())return;ticket++;tab=key;render();},tab===key?'active':''));refPanel($('main'),[...(r.references||[]),...r.logs.flatMap(l=>l.references||[])]);$('main').append(tabs);const content=n('div');content.id='content';$('main').append(content);if(tab==='overview')overview(content);if(tab==='receive')receive(content);if(tab==='materials')materials(content);if(tab==='history')history(content);}
function overview(box){const r=selected;const next=n('section',undefined,'next-card');next.append(n('span','接下来，先做这一件事','eyebrow'),n('h2',r.task.nextAction||'接手第一步尚未填写'),n('p','目标：'+(r.task.goal||'未填写')));box.append(next);const recent=[...r.events].reverse().find(e=>e.note&&['note','finish_session','complete','block','question'].includes(e.kind));if(recent)box.append(paragraph('最新工作记录 · '+recent.actor,recent.note));const grid=n('div',undefined,'grid');grid.append(paragraph('停在哪里',r.task.stopPoint),paragraph('已经完成',r.task.completed),paragraph('如何运行 / 复现',r.task.runInstructions),paragraph('怎样算完成',r.task.acceptance));box.append(grid);if(r.task.cautions)box.append(paragraph('注意与未知',r.task.cautions));if(r.workspace?.files.length)box.append(n('p','保存时有 '+r.workspace.files.length+' 项未提交工作。交接文件没有携带这些文件的完整副本；接手前先核查，避免丢失或覆盖。','notice'));if(r.checklist.length){const section=n('section',undefined,'panel');section.append(n('h2','行动与验证清单'));for(const c of r.checklist){const row=n('div',undefined,'check-row'),body=n('div',undefined,'check-body');body.append(n('strong',c.text));const status=n('select');status.dataset.checkId=c.id;status.setAttribute('aria-label',c.text+'状态');for(const [key,label] of [['pending','待做'],['done','已做'],['blocked','遇到问题']]){const o=n('option',label);o.value=key;status.append(o);}status.value=c.state;status.disabled=r.state==='completed';const note=n('textarea');note.value=c.note;note.placeholder='实际结果或遇到的问题';note.dataset.checkNote=c.id;note.maxLength=2000;const evidence=n('input');evidence.value=c.evidence;evidence.placeholder='依据：文件、命令结果或验证记录';evidence.dataset.checkEvidence=c.id;evidence.maxLength=1000;[status,note,evidence].forEach(e=>{e.oninput=()=>dirty=true;if(r.state==='completed')e.disabled=true;});body.append(note,evidence);row.append(status,body);section.append(row);}if(r.state!=='completed')section.append(btn('保存清单结果',saveChecklist,'primary'));box.append(section);}box.append(n('p','检查清单与完成状态均由参与者记录；不代替独立验收或团队架构批准。','hint'));}
async function saveChecklist(){await lock(async()=>{const checks=selected.checklist.map(c=>({...c,state:document.querySelector('[data-check-id="'+CSS.escape(c.id)+'"]').value,note:document.querySelector('[data-check-note="'+CSS.escape(c.id)+'"]').value,evidence:document.querySelector('[data-check-evidence="'+CSS.escape(c.id)+'"]').value}));selected=(await post('update',{id:selected.id,expectedVersion:selected.version,checklist:checks})).record;dirty=false;await refreshList();render();msg('清单结果已保存');});}
function receive(box){
  const current=ticket;
  const inspection=n('details',undefined,'panel');
  inspection.open=!['active','completed'].includes(selected.state);
  inspection.append(n('summary','项目与版本核对'));
  const facts=n('div');facts.append(n('p','正在核对…','hint'));inspection.append(facts);box.append(inspection);showInspection(facts,current);
  const section=n('section',undefined,'panel');section.append(n('h2','这次要做什么'));
  const actions=n('div',undefined,'work-actions');
  const choices=selected.state==='completed'?[['note','记录进展']]:[
    ...(['draft','ready','receiving','blocked'].includes(selected.state)?[['claim',selected.state==='blocked'?'继续工作':'接手']]:[]),
    ['note','记录进展'],['problem','记录问题'],['end','结束']];
  if(!choices.some(([key])=>key===workAction))workAction=choices[0][0];
  for(const [key,label] of choices){const b=btn(label,()=>{if(key===workAction)return;if(!leave())return;dirty=false;workAction=key;render();},workAction===key?'active':'');b.setAttribute('aria-pressed',String(workAction===key));actions.append(b);}
  section.append(actions);const form=n('div');form.id='work-form';section.append(form);box.append(section);renderWorkForm(form);
  const events=n('section',undefined,'panel');events.append(n('h2','工作记录'));if(!selected.events.length)events.append(n('p','还没有记录。','hint'));
  for(const e of [...selected.events].reverse()){const div=n('div',undefined,'event');div.append(n('strong',(kinds[e.kind]||e.kind)+' · '+e.actor),n('p',e.note||'状态已记录'),n('small',time(e.at)+' · '+(provenanceLabels[e.status]||'待核实')+(e.evidence?' · 依据：'+e.evidence:'')));if(e.nextAction)div.append(n('p','下一步：'+e.nextAction));events.append(div);}box.append(events);
}
function renderWorkForm(form){
  const r=selected,action=workAction;
  const error=n('div',undefined,'notice');error.id='work-error';error.hidden=true;error.setAttribute('role','alert');form.append(error);
  if(action==='claim'){
    form.append(n('p',r.state==='blocked'?'说明问题如何处理，或为何现在可以继续。':'接手后即可记录工作。下面是检查提醒，不要求全部勾选；未勾选的内容不会算作通过。','hint'));
    const details=n('details');details.append(n('summary','接手检查 · 选填'));
    for(const [key,label] of Object.entries(reviews)){const l=n('label',undefined,'choice'),c=n('input');c.type='checkbox';c.dataset.review=key;l.append(c,n('span',label));details.append(l);}form.append(details);

$('import-file').onchange=async()=>{const file=$('import-file').files[0];$('import-file').value='';if(!file||!leave())return;if(file.size>12*1024*1024||!file.size){msg('请选 1 字节至 12 MB 的交接 JSON');return;}await lock(async()=>{let uploadId;try{const start=await post('import_start',{filename:file.name,size:file.size});uploadId=start.uploadId;for(let offset=0;offset<file.size;offset+=start.chunkBytes){msg('正在接收文件 '+Math.round(offset/file.size*100)+'%');const chunk=new Uint8Array(await file.slice(offset,offset+start.chunkBytes).arrayBuffer());let binary='';for(const b of chunk)binary+=String.fromCharCode(b);await post('import_chunk',{uploadId,offset,base64:btoa(binary)});}selected=(await post('import_finish',{uploadId})).record;editing=dirty=false;ticket++;tab='receive';await refreshList();render();msg('已接收资料。请核对本机项目并记录接手结果。');}catch(e){if(uploadId)try{await post('import_cancel',{uploadId});}catch(_){}throw e;}});};
$('actor').value=sessionStorage.getItem('continuity-github-actor')||'';$('actor').oninput=()=>sessionStorage.setItem('continuity-github-actor',$('actor').value);window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});

function parseRefs(value){return value.split('\n').filter(x=>x.trim()).map(line=>{const [url,...reason]=line.split('|');return {url:url.trim(),reason:reason.join('|').trim()};});}
function refsEditor(parent,refs=[]){const label=n('label','关联 GitHub 工作项 · 每行一个链接，可用 | 补充说明','field');const input=n('textarea');input.id='github-references';input.maxLength=14000;input.placeholder='https://github.com/团队/仓库/issues/46 | 本次要解决的问题\n提交及源码请使用完整 SHA';input.value=refs.map(r=>r.url+(r.reason?' | '+r.reason:'')).join('\n');input.oninput=()=>dirty=true;label.append(input);const quick=n('button','关联当前代码提交');quick.type='button';quick.onclick=()=>{let url=typeof currentCodeUrl!=='undefined'?currentCodeUrl:null;if(!url&&typeof config!=='undefined'&&config){const source=document.getElementById('source-value')?.value||config.defaultSource.value;const match=source.match(/^https:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+?)(?:\.git)?\/?$/);if(match)url='https://github.com/'+match[1]+'/commit/'+config.revision;}if(!url){msg('未找到 GitHub 仓库来源；可先填写来源或直接粘贴固定提交链接。');return;}const values=parseRefs(input.value);if(!values.some(r=>r.url===url)){input.value+=(input.value.trim()?'\n':'')+url+' | 保存时的代码版本';dirty=true;}};label.append(quick);parent.append(label,n('p','只保存关联，不联网、不请求账号权限。链接状态未核实；提交和源码固定到完整版本。','hint'));}
async function verifyRefs(refs){const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_references',references:refs.map(r=>({url:r.url}))})});const d=await response.json();if(!response.ok)throw Error(d.error);const box=n('div');for(const r of d.references){const a=n('a',r.url);a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';box.append(a,n('p',r.note,'hint'));if(r.content!==undefined)box.append(n('pre',r.content+(r.truncated?'\n…截断':'')));}return box;}
function refPanel(parent,refs=[]){if(!refs.length)return;const panel=n('section',undefined,'panel');panel.append(n('h3','关联工作项与代码'));const byUrl=new Map();for(const r of refs){const old=byUrl.get(r.url);if(!old||(!old.reason&&r.reason))byUrl.set(r.url,r);}const unique=[...byUrl.values()];for(const r of unique){const a=n('a',r.label||r.url);a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';panel.append(a,n('p',r.reason||'参与者关联 · 远端状态未核实','hint'));}const b=n('button','核查本机提交 / 查看代码');b.onclick=async()=>{try{const content=await verifyRefs(unique.slice(0,30));if(typeof showDetail==='function')showDetail('代码依据核查',content);else{const old=document.getElementById('ref-verification');if(old)old.remove();content.id='ref-verification';panel.append(content);}}catch(e){msg(e.message);}};panel.append(b);parent.append(panel);}

let pendingLogId=null;
async function openExperimentalLogs(id){if(!leave())return;try{const data=await get('log_page');const frame=n('iframe');frame.id='experimental-log-frame';frame.style='width:100%;height:75vh;border:0';frame.title='实验工作日志 · 独立数据';frame.srcdoc=data.html;frame.onload=()=>{if(id)frame.contentWindow.postMessage({type:'open-experimental-log',id},location.origin);};showDetail('实验工作日志',frame);$('detail').style.width='min(1400px,96vw)';}catch(e){msg(e.message);}}
$('experimental-logs').onclick=()=>openExperimentalLogs();
$('reference-workspace').onclick=async()=>{if(!leave())return;try{const d=await get('reference_index'),box=n('div');box.append(n('p','同一工作项的日志与交接 · 关联内容未独立核实','hint'));for(const g of d.items){const panel=n('section',undefined,'panel');refPanel(panel,[g.reference]);for(const t of g.tasks)panel.append(btn('交接：'+t.title,()=>{$('detail').close();open(t.id);},'quiet'));for(const l of g.logs)panel.append(btn('日志：'+l.title,()=>openExperimentalLogs(l.id),'quiet'));box.append(panel);}if(!d.items.length)box.append(n('p','暂未关联工作项。在实验日志或接续点中粘贴 Issue、PR 或固定提交链接。','hint'));showDetail('工作项索引',box);}catch(e){msg(e.message);}};
$('detail').addEventListener('cancel',e=>{const frame=$('experimental-log-frame');if(frame?.contentWindow?.hasUnsavedExperiment?.()&&!confirm('实验日志有未保存内容，确定关闭吗？'))e.preventDefault();});
window.addEventListener('message',async e=>{const frame=$('experimental-log-frame');if(!frame||e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.type!=='handoff-from-log')return;pendingLogId=e.data.id;$('detail').close();await newRecord();const checkbox=[...document.querySelectorAll('[data-log-id]')].find(c=>c.dataset.logId===pendingLogId);if(checkbox){checkbox.checked=true;dirty=true;}pendingLogId=null;});
$('close-detail').onclick=()=>{const frame=$('experimental-log-frame');if(frame?.contentWindow?.hasUnsavedExperiment?.()&&!confirm('实验日志有未保存内容，确定关闭吗？'))return;$('detail').close();revoke();};

empty();Promise.all([get('config'),refreshList()]).then(([c])=>config=c).catch(e=>msg(e.message));
</script></body></html>
