<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验工作日志 · ProjectMind</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:#0071e3;text-decoration:none}button{border:0;border-radius:9px;padding:9px 14px;background:#eaeaee;color:#303034}button:hover{filter:brightness(.97)}button.primary{background:#0071e3;color:white}button.quiet{background:transparent;color:#626269}header{height:76px;background:#ffffffb8;backdrop-filter:blur(20px);border-bottom:1px solid #e2e2e7;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}header h1{font-size:20px;letter-spacing:-.6px;margin:0}header small{font-size:12px;color:#86868b;margin-left:15px}.shell{display:grid;grid-template-columns:215px 310px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{padding:34px 17px;background:#ededf180;border-right:1px solid #dddde3}.eyebrow{font-size:11px;color:#86868b;letter-spacing:1px;margin:0 14px 16px}nav button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;margin:4px 0;background:transparent;font-size:14px}nav button.active{background:white;color:#0071e3;box-shadow:0 3px 15px #00000006}nav span{font-size:18px}nav em{font-style:normal;margin-left:auto;font-size:11px;color:#86868b}.sidebar-note{font-size:12px;line-height:1.8;color:#86868b;padding:16px 14px;margin-top:36px}.collection{border-right:1px solid #dddde3;padding:29px 20px;background:#fafafc}.collection h2{margin:0 0 20px;font-size:18px;font-weight:600}.search{width:100%;border:1px solid #e2e2e7;border-radius:10px;padding:10px 12px;background:#eeeeF2;font-size:13px}.list-tools{display:flex;gap:8px;margin:15px 0 20px}.list-tools button{flex:1;font-size:13px}.card{display:block;width:100%;background:transparent;text-align:left;padding:17px 13px;border:1px solid transparent;border-bottom:1px solid #e5e5eb;border-radius:12px;margin-bottom:6px}.card.active{background:white;border-color:#d5e5f6;box-shadow:0 4px 16px #00000004}.card strong{display:block;font-size:14px;font-weight:600;line-height:1.6;overflow-wrap:anywhere}.card small{display:block;color:#86868b;font-size:11px;margin-top:8px}.card p{font-size:12px;color:#76767e;line-height:1.6;margin:7px 0 0;overflow-wrap:anywhere}.reader{padding:38px clamp(24px,4vw,68px) 60px;min-width:0;background:white}.empty{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#86868b}.empty .symbol{font-size:42px;color:#b8c5d0;margin-bottom:20px}.empty h2{font-size:23px;color:#1d1d1f;font-weight:600;margin:0 0 12px}.empty p{font-size:14px;line-height:1.8;max-width:330px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:26px;flex-wrap:wrap}.badge{font-size:11px;padding:6px 10px;background:#f0f3f7;color:#637080;border-radius:20px}.toolbar .spacer{flex:1}.reader h2.title{font-size:30px;letter-spacing:-1px;line-height:1.35;margin:20px 0 12px;overflow-wrap:anywhere}.meta{font-size:12px;line-height:1.8;color:#86868b;margin-bottom:30px;overflow-wrap:anywhere}.prose{font-size:15px;line-height:1.9;overflow-wrap:anywhere}.prose p{white-space:pre-wrap}.prose h1{font-size:25px}.prose h2{font-size:21px}.prose h3{font-size:18px}.prose pre{white-space:pre-wrap;background:#f5f5f7;border-radius:10px;padding:18px;font:13px/1.8 ui-monospace,monospace}.prose li{margin:5px 0}.prose blockquote{margin:15px 0;border-left:3px solid #c6d7e9;padding-left:16px;color:#686875}.attachment{padding:18px;border:1px solid #e5e5ea;border-radius:14px;margin:28px 0}.attachment-top{display:flex;gap:12px;align-items:center;justify-content:space-between;overflow-wrap:anywhere}.attachment small{font-size:12px;color:#86868b;display:block;margin-top:10px;line-height:1.7}.pdf{display:block;width:100%;height:70vh;border:0;margin-top:20px;border-radius:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid label,.body-label{display:block;font-size:12px;color:#86868b;margin-bottom:10px}input,select,textarea{width:100%;padding:11px 12px;margin-top:7px;border:1px solid #dddde3;border-radius:9px;background:#fafafc;color:#1d1d1f}input.title-input{font-size:25px;font-weight:600;background:white;border:0;border-bottom:1px solid #ededf0;border-radius:0;padding:10px 0;margin:0 0 25px}.body-label{margin-top:24px}textarea{resize:vertical;min-height:280px;line-height:1.8;font-size:15px;background:white}.help{font-size:12px;color:#86868b;line-height:1.8}.status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#252527;color:white;box-shadow:0 8px 30px #0002;padding:12px 22px;border-radius:14px;font-size:13px;max-width:90vw;z-index:5}.status:empty{display:none}dialog{border:1px solid #dddde3;border-radius:20px;padding:28px;max-width:720px;width:90vw;max-height:85vh;box-shadow:0 20px 70px #0002}dialog::backdrop{background:#0004;backdrop-filter:blur(4px)}dialog h2{margin-top:0;font-size:20px}.history-item{padding:15px 0;border-bottom:1px solid #eee}.history-item pre{white-space:pre-wrap;font:13px/1.8 inherit;max-height:260px;overflow:auto}.history-item small{color:#86868b}#close-history{float:right}.mobile-back{display:none}@media(max-width:1100px){.shell{grid-template-columns:190px 260px minmax(0,1fr)}.reader{padding:30px 26px}header small{display:none}}@media(max-width:820px){.shell{grid-template-columns:180px minmax(0,1fr)}.collection{border-right:0}.reader{grid-column:1/-1;border-top:1px solid #dddde3}.empty{min-height:250px}}@media(max-width:520px){header{padding:0 18px;height:68px}header h1{font-size:18px}header button{font-size:11px;padding:8px}aside{padding:20px 10px}.shell{grid-template-columns:1fr}nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}nav button{font-size:12px;padding:9px}.sidebar-note,.eyebrow{display:none}.collection{padding:20px}.reader{padding:25px 20px}.form-grid{grid-template-columns:1fr 1fr}.reader h2.title{font-size:25px}}
</style></head><body>
<header><div><a href="/" aria-label="返回项目地图">‹</a> <h1 style="display:inline;margin-left:12px">实验工作日志</h1><small>让工作有迹可循</small></div><div><a href="/" style="font-size:12px;margin-right:14px">项目地图</a><button id="backup" class="quiet">导出备份</button></div></header>
<div class="shell"><aside><p class="eyebrow">项目工作记录</p><nav id="categories" aria-label="日志分类"></nav><p class="sidebar-note">保存进展与依据，接续下一步。<br>本机项目记录 · 尚未独立核实</p></aside><section class="collection"><h2 id="category-title"></h2><input id="search" class="search" placeholder="搜索标题、正文或作者" aria-label="搜索工作记录"><div class="list-tools"><button class="primary" id="new">＋ 新建记录</button><button id="import">导入文件</button></div><input type="file" id="file" accept=".md,.doc,.docx,.pdf" hidden><div id="list"></div></section><main class="reader" id="reader"></main></div><div class="status" role="status" aria-live="polite" id="status"></div><dialog id="history"><button id="close-history">关闭</button><h2>修改历史</h2><div id="history-content"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), API='/api/extensions/continuity_github';
const categories={daily:['每日工作日志','▤'],decision:['关键决策','◇'],goal:['当前目标','◎'],issue:['待解决事项','◷']};
let currentCodeUrl=null;let entries=[], category='daily', selected=null, editing=false, dirty=false, busy=false, ticket=0, objectUrls=[];
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function node(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n;}
let messageTimer;function message(value){clearTimeout(messageTimer);$('status').textContent=value;messageTimer=setTimeout(()=>$('status').textContent='',5000);}
async function request(action,data){const body=JSON.stringify({action:'log_'+action,...data});if(new TextEncoder().encode(body).length>65536)throw Error('内容超过单次保存上限，请缩短正文或通过文件导入。');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body});const result=await r.json();if(!r.ok)throw Error(result.error||'操作失败');return result;}
async function get(action,params={}){const r=await fetch(API+'?'+new URLSearchParams({action:'log_'+action,...params}));const data=await r.json();if(!r.ok)throw Error(data.error||'读取失败');return data;}
function canLeave(){return !busy&&(!dirty||confirm('有尚未保存的编辑，确定放弃吗？'));}
function release(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];}
function download(raw,name,mime){const u=URL.createObjectURL(new Blob([raw],{type:mime}));const a=node('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function bytes(encoded){return Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));}
function prose(content){const out=node('div',undefined,'prose');let code=null, lines=[];for(const line of content.split('\n')){if(line.startsWith('```')){if(code){out.append(node('pre',lines.join('\n')));code=null;lines=[];}else code=true;continue;}if(code){lines.push(line);continue;}const heading=line.match(/^(#{1,3})\s+(.*)/);if(heading){out.append(node('h'+heading[1].length,heading[2]));continue;}const list=line.match(/^\s*(?:[-*+]\s+|\d+\.\s+)(.*)/);if(list){const last=out.lastElementChild;const ul=last&&last.tagName==='UL'?last:node('ul');if(ul!==last)out.append(ul);ul.append(node('li',list[1]));continue;}if(line.startsWith('> ')){out.append(node('blockquote',line.slice(2)));continue;}if(line.trim())out.append(node('p',line));}if(code)out.append(node('pre',lines.join('\n')));return out;}
function renderList(){const nav=$('categories');nav.replaceChildren();for(const [key,[name,icon]] of Object.entries(categories)){const b=node('button',undefined,key===category?'active':'');b.append(node('span',icon),node('strong',name),node('em',String(entries.filter(e=>e.category===key).length)));b.setAttribute('aria-current',key===category?'page':'false');b.onclick=()=>{if(!canLeave())return;ticket++;category=key;selected=null;editing=dirty=false;renderList();empty();};nav.append(b);}$('category-title').textContent=categories[category][0];const query=$('search').value.toLowerCase();const filtered=entries.filter(e=>e.category===category&&[e.title,e.body,e.author,e.attachment?.name||''].join(' ').toLowerCase().includes(query));$('list').replaceChildren();for(const e of filtered){const b=node('button',undefined,'card'+(selected?.id===e.id?' active':''));b.append(node('strong',e.title),node('p',e.body.slice(0,75)||e.attachment?.name||'暂无正文'),node('small',e.date+' · '+(e.origin==='ai'?'AI 候选':(e.author||'项目记录'))));b.onclick=()=>open(e.id);$('list').append(b);}if(!filtered.length)$('list').append(node('p',query?'没有匹配的记录':'这里还没有记录。新建或导入一份文件。','help'));}
async function refresh(){const data=await get('list');entries=data.entries;currentCodeUrl=data.currentCodeUrl;renderList();}
function empty(){release();$('reader').replaceChildren();const box=node('div',undefined,'empty');box.append(node('div','▤','symbol'),node('h2','把工作留在项目里'),node('p','记录今天的进展、选择的依据，以及下一步需要解决的问题。支持 Markdown、Word 和 PDF。'));$('reader').append(box);}
async function open(id){if(!canLeave())return;const current=++ticket;try{const result=await get('get',{id});if(current!==ticket)return;selected=result.entry;editing=dirty=false;renderList();await read(current);}catch(e){message(e.message);}}
async function read(current=++ticket){release();const e=selected;const reader=$('reader');reader.replaceChildren();const bar=node('div',undefined,'toolbar');bar.append(node('span',categories[e.category][0],'badge'),node('span',e.origin==='ai'?'AI 候选 · 未核实':'工作记录 · 未核实','badge'),node('span',undefined,'spacer'));const edit=node('button','编辑'),history=node('button','修改历史','quiet');edit.onclick=()=>{if(busy)return;ticket++;editing=true;editor();};history.onclick=showHistory;bar.append(history,edit);refPanel(reader,e.references||[]);const handoff=node('button','选入新的交接');handoff.onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'handoff-from-log',id:e.id},location.origin);};bar.append(handoff);reader.append(bar,node('h2',e.title,'title'),node('div',e.date+' · '+(e.author||'未填写作者')+' · 第 '+e.version+' 版\n保存时的代码版本：'+e.codeRevision,'meta'));if(e.body)reader.append(prose(e.body));if(e.category==='decision')reader.append(node('p','该分类用于保存决策记录；不代表团队已批准正式项目模型。','help'));if(e.attachment){const box=node('section',undefined,'attachment');box.append(node('p','正在读取导入文档…','help'));reader.append(box);try{const f=(await get('file',{id:e.attachment.id})).file;if(current!==ticket||editing)return;box.replaceChildren();const top=node('div',undefined,'attachment-top'),button=node('button','下载原件','quiet');button.onclick=()=>download(bytes(f.base64),f.name,f.mime);top.append(node('strong',f.name),button);box.append(top,node('small',f.note||'Markdown 正文视图；原始文件保留。'));if(f.kind==='pdf'){const url=URL.createObjectURL(new Blob([bytes(f.base64)],{type:'application/pdf'}));objectUrls.push(url);const frame=node('iframe',undefined,'pdf');frame.title='PDF 原文预览';frame.src=url;box.append(frame,node('small','若浏览器未显示 PDF，可下载原件查看。'));}else box.append(prose(f.preview));}catch(err){if(current===ticket)box.replaceChildren(node('p',err.message,'help'));}}}
function field(label,id,type,value){const l=node('label',label),input=node(type==='select'?'select':'input');input.id=id;if(type==='select'){const options=id==='edit-origin'?{human:'人工记录',ai:'AI 生成'}:Object.fromEntries(Object.entries(categories).map(([k,v])=>[k,v[0]]));for(const [key,title] of Object.entries(options)){const o=node('option',title);o.value=key;input.append(o);}}else input.type=type;input.value=value;l.append(input);return l;}
function editor(){release();$('reader').replaceChildren();const e=selected||{title:'',body:'',date:today(),category,author:'',origin:'human'};const bar=node('div',undefined,'toolbar');bar.append(node('span',selected?'编辑记录':'新建记录','badge'),node('span',undefined,'spacer'));const cancel=node('button','取消','quiet'),save=node('button','保存记录','primary');cancel.onclick=()=>{if(!canLeave())return;dirty=editing=false;selected?read():empty();};save.onclick=saveRecord;bar.append(cancel,save);$('reader').append(bar);const title=node('input',undefined,'title-input');title.id='edit-title';title.placeholder='给这次工作一个标题';title.maxLength=200;title.value=e.title;title.setAttribute('aria-label','记录标题');$('reader').append(title);const grid=node('div',undefined,'form-grid');grid.append(field('记录日期','edit-date','date',e.date),field('记录分类','edit-category','select',e.category),field('作者 / 工具名称','edit-author','text',e.author),field('内容来源','edit-origin','select',e.origin));$('reader').append(grid);$('edit-author').maxLength=100;const label=node('label','正文 · 支持 Markdown','body-label'),body=node('textarea');body.id='edit-body';body.value=e.body;body.maxLength=15000;body.placeholder='做了什么、依据是什么、验证结果怎样、下一步从哪里继续…';label.append(body);refsEditor($('reader'),e.references||[]);$('reader').append(label,node('p',selected?.attachment?'原始导入文件会保留。正文可补充说明；修改历史记录每次保存。':'保存后持续保留在本机项目。AI 内容保持候选状态；所有记录均未独立核实。','help'));$('reader').querySelectorAll('input,select,textarea').forEach(n=>n.oninput=()=>dirty=true);title.focus();}
async function saveRecord(){if(busy)return;busy=true;const controls=[...$('reader').querySelectorAll('input,select,textarea,button')];controls.forEach(n=>n.disabled=true);const data={references:parseRefs($('github-references').value),title:$('edit-title').value,body:$('edit-body').value,date:$('edit-date').value,category:$('edit-category').value,author:$('edit-author').value,origin:$('edit-origin').value};if(selected)Object.assign(data,{id:selected.id,expectedVersion:selected.version});try{selected=(await request('save',data)).entry;editing=dirty=false;category=selected.category;await refresh();await read();message('已保存 · 修改历史已保留');}catch(e){message(e.message);}finally{busy=false;controls.forEach(n=>n.disabled=false);}}
async function showHistory(){const id=selected?.id;if(!id)return;try{const data=await get('history',{id});const box=$('history-content');box.replaceChildren();for(const e of data.history){const item=node('div',undefined,'history-item');item.append(node('strong','第 '+e.version+' 版 · '+e.title),node('p',e.updatedAt+' · '+(e.author||'未填写作者')+' · '+(e.origin==='ai'?'AI 候选':'人工记录'),'help'),node('small',categories[e.category][0]+' · '+e.date),node('pre',e.body||'无附加正文'));box.append(item);}$('history').showModal();}catch(e){message(e.message);}}
$('close-history').onclick=()=>$('history').close();$('search').oninput=renderList;$('new').onclick=()=>{if(!canLeave())return;ticket++;selected=null;editing=true;dirty=false;renderList();editor();};$('import').onclick=()=>{if(canLeave())$('file').click();};
$('file').onchange=async()=>{const file=$('file').files[0];$('file').value='';if(!file)return;if(file.size>10*1024*1024||!file.size){message('请选择 1 字节至 10 MB 的文件');return;}if(!canLeave())return;busy=true;ticket++;let uploadId;try{const meta=editing?{references:parseRefs($('github-references').value),author:$('edit-author').value,origin:$('edit-origin').value,date:$('edit-date').value,category:$('edit-category').value}:{author:'',origin:'human',date:today(),category};const start=await request('import_start',{...meta,title:file.name.replace(/\.[^.]+$/,''),body:'',filename:file.name,size:file.size});uploadId=start.uploadId;for(let offset=0;offset<file.size;offset+=start.chunkBytes){message('正在导入 '+Math.round(offset/file.size*100)+'%');const chunk=new Uint8Array(await file.slice(offset,offset+start.chunkBytes).arrayBuffer());let binary='';for(const byte of chunk)binary+=String.fromCharCode(byte);await request('import_chunk',{uploadId,offset,base64:btoa(binary)});}message('正在准备文档视图…');selected=(await request('import_finish',{uploadId})).entry;dirty=editing=false;category=selected.category;await refresh();await read();message('导入完成 · 原件已保存');}catch(e){if(uploadId)try{await request('import_cancel',{uploadId});}catch(_){}message(e.message);}finally{busy=false;}};
$('backup').onclick=async()=>{if(busy)return;try{message('正在准备备份…');const data=await get('backup');download(JSON.stringify(data,null,2),'projectmind-worklog-'+today()+'.json','application/json');message('备份已导出，包含记录、历史和原件');}catch(e){message(e.message);}};
const n=node,msg=message;

function parseRefs(value){return value.split('\n').filter(x=>x.trim()).map(line=>{const [url,...reason]=line.split('|');return {url:url.trim(),reason:reason.join('|').trim()};});}
function refsEditor(parent,refs=[]){const label=n('label','关联 GitHub 工作项 · 每行一个链接，可用 | 补充说明','field');const input=n('textarea');input.id='github-references';input.maxLength=14000;input.placeholder='https://github.com/团队/仓库/issues/46 | 本次要解决的问题\n提交及源码请使用完整 SHA';input.value=refs.map(r=>r.url+(r.reason?' | '+r.reason:'')).join('\n');input.oninput=()=>dirty=true;label.append(input);const quick=n('button','关联当前代码提交');quick.type='button';quick.onclick=()=>{let url=typeof currentCodeUrl!=='undefined'?currentCodeUrl:null;if(!url&&typeof config!=='undefined'&&config){const source=document.getElementById('source-value')?.value||config.defaultSource.value;const match=source.match(/^https:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+?)(?:\.git)?\/?$/);if(match)url='https://github.com/'+match[1]+'/commit/'+config.revision;}if(!url){msg('未找到 GitHub 仓库来源；可先填写来源或直接粘贴固定提交链接。');return;}const values=parseRefs(input.value);if(!values.some(r=>r.url===url)){input.value+=(input.value.trim()?'\n':'')+url+' | 保存时的代码版本';dirty=true;}};label.append(quick);parent.append(label,n('p','只保存关联，不联网、不请求账号权限。链接状态未核实；提交和源码固定到完整版本。','hint'));}
async function verifyRefs(refs){const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_references',references:refs.map(r=>({url:r.url}))})});const d=await response.json();if(!response.ok)throw Error(d.error);const box=n('div');for(const r of d.references){const a=n('a',r.url);a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';box.append(a,n('p',r.note,'hint'));if(r.content!==undefined)box.append(n('pre',r.content+(r.truncated?'\n…截断':'')));}return box;}
function refPanel(parent,refs=[]){if(!refs.length)return;const panel=n('section',undefined,'panel');panel.append(n('h3','关联工作项与代码'));const byUrl=new Map();for(const r of refs){const old=byUrl.get(r.url);if(!old||(!old.reason&&r.reason))byUrl.set(r.url,r);}const unique=[...byUrl.values()];for(const r of unique){const a=n('a',r.label||r.url);a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';panel.append(a,n('p',r.reason||'参与者关联 · 远端状态未核实','hint'));}const b=n('button','核查本机提交 / 查看代码');b.onclick=async()=>{try{const content=await verifyRefs(unique.slice(0,30));if(typeof showDetail==='function')showDetail('代码依据核查',content);else{const old=document.getElementById('ref-verification');if(old)old.remove();content.id='ref-verification';panel.append(content);}}catch(e){msg(e.message);}};panel.append(b);parent.append(panel);}

const copyButton=node('button','带入原日志 · 副本');$('new').parentElement.append(copyButton);copyButton.onclick=async()=>{if(!canLeave())return;try{const response=await fetch(API+'?action=original_logs');const d=await response.json();if(!response.ok)throw Error(d.error);const box=$('history-content');box.replaceChildren(node('p','复制后在实验版编辑；原日志不会被修改。','help'));for(const e of d.entries){const b=node('button',e.title+' · 第 '+e.version+' 版');b.onclick=async()=>{try{const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'copy_original_log',id:e.id})});const result=await response.json();if(!response.ok)throw Error(result.error);$('history').close();selected=result.entry;category=selected.category;editing=dirty=false;await refresh();await read();message('已复制 · 原日志未改变');}catch(err){message(err.message);}};box.append(b);}if(!d.entries.length)box.append(node('p','本机原日志为空。可以直接创建实验日志。','help'));$('history').showModal();}catch(e){message(e.message);}};
window.hasUnsavedExperiment=()=>dirty||busy;window.addEventListener('message',e=>{if(e.source===window.parent&&e.origin===location.origin&&e.data?.type==='open-experimental-log')open(e.data.id);});
window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});renderList();empty();refresh().catch(e=>message(e.message));
</script></body></html>
