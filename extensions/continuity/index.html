}.panel p,.panel pre,.copy-text{white-space:pre-wrap;font-size:13px;line-height:1.9;overflow-wrap:anywhere;color:#565660;margin:0}.panel pre{font:12px/1.8 ui-monospace,monospace;max-height:380px;overflow:auto;padding:15px;background:#f5f5f7;border-radius:9px}.hint{font-size:12px;color:#86868b;line-height:1.8;margin:10px 0;white-space:pre-wrap}.notice{padding:13px 16px;border:1px solid #e7dfcb;border-radius:10px;background:#fffaf0;color:#8f7850;font-size:12px;line-height:1.8;margin:16px 0}.check-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #ececf0;align-items:flex-start}.check-row:last-child{border:0}.check-row .check-body{flex:1;min-width:0}.check-row strong{font-size:13px;font-weight:550;line-height:1.7}.check-row select{width:100px;padding:7px;font-size:11px}.check-row textarea{font-size:12px;min-height:55px;margin-top:8px}.check-row input{font-size:12px;margin-top:8px;padding:8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:block;font-size:12px;color:#777782;margin-bottom:16px}.field input,.field textarea,.field select{margin-top:8px}.field.wide{grid-column:1/-1}.field.title input{font-size:23px;font-weight:600}.choice{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.8;margin:10px 0;color:#5e5e68}.choice input{width:auto;margin-top:4px;accent-color:#0071e3}.choice small{color:#86868b}.log-list{max-height:300px;overflow:auto}.log-item{padding:10px 0;border-bottom:1px solid #eee}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.empty{min-height:440px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.empty span{font-size:40px;color:#a6bbd2}.empty h1{font-size:30px;margin:20px 0 10px}.empty p{max-width:440px;color:#86868b;font-size:14px;line-height:1.9}.empty .buttons{display:flex;gap:10px;margin-top:20px}.event{border-left:2px solid #dee7f0;padding:0 0 20px 18px;margin-left:5px}.event strong{font-size:12px}.event p{font-size:13px;line-height:1.8;white-space:pre-wrap;margin:9px 0;color:#565660}.event small{font-size:11px;color:#86868b}.export-bar{display:flex;gap:9px;flex-wrap:wrap}.file-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ececf0;font-size:12px;overflow-wrap:anywhere}.file-row button{margin-left:auto;flex-shrink:0;padding:6px 9px;font-size:10px}details{margin:12px 0}summary{cursor:pointer;color:#696974;font-size:12px;line-height:1.8}iframe.pdf{width:100%;height:60vh;border:0;margin-top:20px}.status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:92vw;background:#252527;color:#fff;box-shadow:0 5px 25px #0002;font-size:13px;line-height:1.8;padding:12px 20px;border-radius:13px;z-index:10}.status:empty{display:none}dialog{width:min(820px,90vw);max-height:85vh;border:1px solid #dddde3;border-radius:18px;padding:26px;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0004;backdrop-filter:blur(4px)}dialog pre{white-space:pre-wrap;font:12px/1.8 ui-monospace,monospace;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:space-between;align-items:center}.inspection-line{display:flex;gap:15px;justify-content:space-between;align-items:flex-start;font-size:12px;padding:12px 0;border-bottom:1px solid #eee}.inspection-line span{color:#86868b;flex-shrink:0}.inspection-line strong{font-weight:500;overflow-wrap:anywhere;text-align:right}.success{color:#307b60}.warning{color:#a57535}.muted{color:#86868b}.badge-note{padding:4px 8px;background:#f1f1f5;border-radius:6px;font-size:10px;display:inline-block;color:#86868b}@media(max-width:960px){.layout{grid-template-columns:250px minmax(0,1fr)}main{padding:28px 22px}.grid,.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:650px){header{padding:16px 18px;align-items:flex-start}.links{gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:170px;font-size:10px}.brand{font-size:18px}.layout{grid-template-columns:1fr}aside{pad </style></head><body>
<header><div class="brand">协同交接<small>从停下的位置，继续正确的工作</small></div><nav class="links"><a href="/">项目地图</a><a href="/ext/worklog">工作日志</a><a href="/ext/handoff">原交接包</a></nav></header>
<div class="layout"><aside><div class="side-actions"><button id="new" class="primary">＋ 保存接续点</button><button id="import">接手文件</button></div><input id="import-file" type="file" accept=".json" hidden><div class="actor"><label>当前记录者<input id="actor" placeholder="姓名或 AI 工具名称" maxlength="100"></label><select id="origin" aria-label="反馈来源"><option value="human">人工反馈</option><option value="ai">AI 反馈</option></select><small>名称由填写者声明。记录保存在本机，跨设备通过文件交换。</small></div><input id="search" placeholder="搜索任务或目标" aria-label="搜索接续记录"><div class="filters" id="filters"></div><div id="records"></div></aside><main id="main"></main></div><div id="status" class="status" role="status" aria-live="polite"></div><dialog id="detail"><div class="dialog-actions"><h2 id="detail-title"></h2><button id="close-detail">关闭</button></div><div id="detail-content"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),API='/api/extensions/continuity';
const stateLabels={draft:'准备中',ready:'可交接',receiving:'接手检查中',active:'继续工作中',blocked:'有阻塞',completed:'本次任务完成'};
const kinds={ready:'准备好交接',receive:'开始接手检查',start:'检查后继续工作',block:'记录阻塞',resume:'阻塞解除，继续工作',complete:'记录本次完成',question:'提出具体问题',note:'补充进展 / 澄清'};
const allowed={draft:['ready','question','note'],ready:['receive','question','note'],receiving:['start','block','question','note'],active:['note','block','complete','question'],blocked:['note','resume','question'],completed:['note']};
const reviews={materials:'已找到必要材料；缺失部分有明确处理方式',environment:'已尝试运行 / 验证，或明确本次不需要运行的依据',understanding:'已理解目标、停止位置，以及尚未核实的内容',nextStep:'已明确接下来第一步怎么做和怎样验证'};
let records=[],config=null,selected=null,tab='overview',filter='all',editing=false,dirty=false,busy=false,ticket=0,urls=[];
const n=(tag,value,cls)=>{const node=document.createElement(tag);if(value!==undefined)node.textContent=value;if(cls)node.className=cls;return node;};
const msg=value=>$('status').textContent=value;
async function get(action,params={}){const r=await fetch(API+'?'+new URLSearchParams({action,...params}));const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d;}
async function post(action,data){const body=JSON.stringify({action,...data});if(new TextEncoder().encode(body).length>65536)throw Error('单次保存内容超过上限。请缩短说明，或使用 JSON 文件导入。');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d;}
function actor(){return {actor:$('actor').value.trim(),origin:$('origin').value};}
function leave(){return !busy&&(!dirty||confirm('有尚未保存的内容，确定放弃吗？'));}
function revoke(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
function btn(label,handler,cls){const b=n('button',label,cls);b.onclick=handler;return b;}
function paragraph(label,value){const p=n('section',undefined,'panel');p.append(n('h3',label),n('p',value||'未填写'));return p;}
function time(value){return new Date(value).toLocaleString('zh-CN',{hour12:false});}
async function lock(fn){if(busy)return;busy=true;const nodes=[...document.querySelectorAll('button,input,select,textarea')].map(x=>[x,x.disabled]);nodes.forEach(([x])=>x.disabled=true);try{await fn();}catch(e){msg(e.message);}finally{busy=false;nodes.forEach(([x,old])=>x.disabled=old);}}
async function refreshList(){records=(await get('list')).records;renderList();}
function renderList(){const query=$('search').value.toLowerCase();$('filters').replaceChildren();for(const [key,label] of [['all','全部'],['draft','准备'],['ready','待接手'],['active','进行中'],['blocked','阻塞']])$('filters').append(btn(label,()=>{filter=key;renderList();},key===filter?'active':''));$('records').replaceChildren();const visible=records.filter(r=>(filter==='all'||r.state===filter||filter==='active'&&r.state==='receiving')&&[r.title,r.goal,r.owner].join(' ').toLowerCase().includes(query));for(const r of visible){const b=btn('',()=>open(r.id),'record-card'+(selected?.id===r.id?' active':''));b.append(n('strong',r.title),n('p',r.goal||'尚未填写目标'),n('span',stateLabels[r.state],'pill '+r.state),n('p',(r.checkCount?'清单 '+r.doneCount+'/'+r.checkCount+' · ':'')+'日志 '+r.logCount+' · 第 '+r.version+' 版'),n('small',time(r.updatedAt)));$('records').append(b);}if(!visible.length)$('records').append(n('p',query?'没有匹配的任务':'暂无记录。保存接续点或导入收到的 JSON。','hint'));}
function empty(){revoke();const box=n('div',undefined,'empty');box.append(n('span','↗'),n('h1','工作停下来，理解留下来'),n('p','保存任务停在哪里、已有改动和下一步。回来继续，或交给队友、新 AI，先检查再接着做。'));const buttons=n('div',undefined,'buttons');buttons.append(btn('保存当前接续点',()=>newRecord(),'primary'),btn('接手已有交接文件',()=>$('import-file').click()));box.append(buttons,n('p','原交接包与工作日志仍各自可用，不需要把日常沟通搬到这里。','hint'));$('main').replaceChildren(box);}
async function open(id){if(!leave())return;const current=++ticket;try{const r=(await get('get',{id})).record;if(current!==ticket)return;selected=r;editing=dirty=false;tab='overview';renderList();render();}catch(e){msg(e.message);}}
function render(){revoke();const r=selected;$('main').replaceChildren();const top=n('div',undefined,'topline');top.append(n('span',stateLabels[r.state],'pill '+r.state),n('span','第 '+r.version+' 版','badge-note'),n('span',undefined,'spacer'));if(r.state!=='completed')top.append(btn('编辑 / 更新接续点',()=>editRecord(),'quiet'));top.append(btn('建立下一次接续',()=>followup(),'quiet'));$('main').append(top,n('h1',r.task.title),n('p',(r.task.owner?'发起记录者 '+r.task.owner+' · ':'')+'更新于 '+time(r.updatedAt)+' · 保存时提交 '+r.handoff.codeRevision,'sub'));const tabs=n('div',undefined,'tabs');for(const [key,label] of [['overview','接续摘要'],['receive','接手与反馈'],['materials','证据与日志'],['history','历史与导出']])tabs.append(btn(label,()=>{if(!leave())return;ticket++;tab=key;render();},tab===key?'active':''));$('main').append(tabs);const content=n('div');content.id='content';$('main').append(content);if(tab==='overview')overview(content);if(tab==='receive')receive(content);if(tab==='materials')materials(content);if(tab==='history')history(content);}
function overview(box){const r=selected;const next=n('section',undefined,'next-card');next.append(n('span','接下来，先做这一件事','eyebrow'),n('h2',r.task.nextAction||'接手第一步尚未填写'),n('p','目标：'+(r.task.goal||'未填写')));box.append(next);const grid=n('div',undefined,'grid');grid.append(paragraph('停在哪里',r.task.stopPoint),paragraph('已经完成',r.task.completed),paragraph('如何运行 / 复现',r.task.runInstructions),paragraph('怎样算完成',r.task.acceptance));box.append(grid);if(r.task.cautions)box.append(paragraph('注意与未知',r.task.cautions));if(r.workspace?.files.length)box.append(n('p','保存时有 '+r.workspace.files.length+' 项未提交工作。交接文件没有携带这些文件的完整副本；接手前先核查，避免丢失或覆盖。','notice'));if(r.checklist.length){const section=n('section',undefined,'panel');section.append(n('h2','行动与验证清单'));for(const c of r.checklist){const row=n('div',undefined,'check-row'),body=n('div',undefined,'check-body');body.append(n('strong',c.text));const status=n('select');status.dataset.checkId=c.id;status.setAttribute('aria-label',c.text+'状态');for(const [key,label] of [['pending','待做'],['done','已做'],['blocked','阻塞']]){const o=n('option',label);o.value=key;status.append(o);}status.value=c.state;status.disabled=r.state==='completed';const note=n('textarea');note.value=c.note;note.placeholder='实际结果或阻塞条件';note.dataset.checkNote=c.id;note.maxLength=2000;const evidence=n('input');evidence.value=c.evidence;evidence.placeholder='依据：文件、命令结果或验证记录';evidence.dataset.checkEvidence=c.id;evidence.maxLength=1000;[status,note,evidence].forEach(e=>{e.oninput=()=>dirty=true;if(r.state==='completed')e.disabled=true;});body.append(note,evidence);row.append(status,body);section.append(row);}if(r.state!=='completed')section.append(btn('保存清单结果',saveChecklist,'primary'));box.append(section);}box.append(n('p','检查清单与完成状态均由参与者记录；不代替独立验收或团队架构批准。','hint'));}
async function saveChecklist(){await lock(async()=>{const checks=selected.checklist.map(c=>({...c,state:document.querySelector('[data-check-id="'+CSS.escape(c.id)+'"]').value,note:document.querySelector('[data-check-note="'+CSS.escape(c.id)+'"]').value,evidence:document.querySelector('[data-check-evidence="'+CSS.escape(c.id)+'"]').value}));selected=(await post('update',{id:selected.id,expectedVersion:selected.version,checklist:checks})).record;dirty=false;await refreshList();render();msg('清单结果已保存');});}
function receive(box){const current=ticket;const inspection=n('section',undefined,'panel');inspection.append(n('h2','先看看手里的项目'),n('p','正在核对…','hint'));box.append(inspection);showInspection(inspection,current);const section=n('section',undefined,'panel');section.append(n('h2','留下接手结果或问题'));const select=n('select');select.id='event-kind';for(const kind of allowed[selected.state]){const o=n('option',kinds[kind]);o.value=kind;select.append(o);}section.append(select);const review=n('div');review.id='review-checks';for(const [key,label] of Object.entries(reviews)){const l=n('label',undefined,'choice'),c=n('input');c.type='checkbox';c.dataset.review=key;l.append(c,n('span',label));review.append(l);}section.append(review);const note=n('textarea');note.id='event-note';note.placeholder='写清实际结果、缺少的材料、遇到的问题，或下一步。AI 返回的反馈也可以粘贴到这里。';note.maxLength=4000;note.style.marginTop='15px';const evidence=n('input');evidence.id='event-evidence';evidence.placeholder='验证依据 / 需要补充的文件或结果';evidence.maxLength=2000;evidence.style.marginTop='10px';section.append(note,evidence,n('p','程序不会代你运行命令。请记录实际执行的结果；姓名与来源由填写者声明。','hint'),btn('保存接手反馈',saveEvent,'primary'));function update(){review.hidden=!['start','resume'].includes(select.value);}select.onchange=()=>{dirty=true;update();};note.oninput=evidence.oninput=()=>dirty=true;review.querySelectorAll('input').forEach(c=>c.onchange=()=>dirty=true);update();box.append(section);const events=n('section',undefined,'panel');events.append(n('h2','反馈与澄清'));if(!selected.events.length)events.append(n('p','尚未留下接手反馈。','hint'));for(const e of [...selected.events].reverse()){const div=n('div',undefined,'event');div.append(n('strong',(kinds[e.kind]||e.kind)+' · '+e.actor),n('p',e.note||'状态已记录'),n('small',time(e.at)+' · '+e.status+(e.evidence?' · 依据：'+e.evidence:'')));events.append(div);}box.append(events);}
async function saveEvent(){const kind=$('event-kind').value;const review={};document.querySelectorAll('[data-review]').forEach(e=>review[e.dataset.review]=e.checked);const payload={id:selected.id,expectedVersion:selected.version,kind,...actor(),note:$('event-note').value,evidence:$('event-evidence').value,review};await lock(async()=>{selected=(await post('event',payload)).record;dirty=false;await refreshList();render();msg('反馈已保存 · '+stateLabels[selected.state]);});}
async function showInspection(box,current){try{const d=await get('inspect',{id:selected.id});if(current!==ticket||tab!=='receive')return;box.replaceChildren(n('h2','先看看手里的项目'));const source={address_match:'来源地址一致',same_local_path:'本机路径一致',address_mismatch:'来源地址不同，先确认项目',unknown:'无法自动确认来源，请人工确认'};const revision={same:'与交接时同一提交',different:'代码已不同于交接时',missing:'本机找不到交接提交，请先同步仓库'};for(const [label,value,cls] of [['项目来源',source[d.sourceState],['address_match','same_local_path'].includes(d.sourceState)?'success':'warning'],['代码版本',revision[d.revisionState],d.revisionState==='same'?'success':'warning'],['地图资料',d.mapState==='same_bytes'?'内容与保存时相同，仍未核查适用版本':d.mapState==='changed'?'地图内容已变化，需要复核':'没有可比较的地图内容摘要','muted']]){const row=n('div',undefined,'inspection-line');row.append(n('span',label),n('strong',value,cls));box.append(row);}box.append(n('p',d.sourceNote,'hint'));if(d.comparison){box.append(n('h3','交接之后的文件变化 · '+d.comparison.changes.length));for(const f of d.comparison.changes.slice(0,100))box.append(n('div',f.code+' · '+(f.oldPath?f.oldPath+' → ':'')+f.path,'file-row'));if(d.comparison.changes.length>100)box.append(n('p','仅显示前 100 项，请在 Git 中查看完整比较。','hint'));}if(d.workspace.files.length)box.append(n('p','当前工作区还有 '+d.workspace.files.length+' 项未提交变化。先确认这些改动归属，避免覆盖。','notice'));for(const log of d.logs)if(log.state!=='same_version')box.append(n('p','日志“'+log.title+'”：'+(log.state==='updated'?'本机已有更新，交接包仍保留原版本。':'本机没有对应记录，交接包中的快照仍可读。'),'hint'));box.append(btn('重新核对',()=>showInspection(box,ticket),'quiet'));}catch(e){if(current===ticket)box.replaceChildren(n('h2','核对未完成'),n('p',e.message,'notice'));}}
function materials(box){const r=selected;if(r.scope.length)box.append(n('p','优先查看选定功能；完整地图仍保留，其他功能是否受影响仍需核查。','hint'));const section=n('section',undefined,'panel');section.append(n('h2','功能与代码证据'));const nodes=[...r.handoff.nodes].sort((a,b)=>Number(r.scope.includes(b.id))-Number(r.scope.includes(a.id)));for(const item of nodes){const details=n('details'),sum=n('summary',item.title+(r.scope.includes(item.id)?' · 优先阅读':''));details.append(sum,n('p',item.summary,'hint'),n('p','入口：'+item.entryPoint,'hint'));for(const p of item.evidencePaths){const row=n('div',undefined,'file-row');row.append(n('span',p),btn('查看交接版本原文',()=>evidence(p),'quiet'));details.append(row);}section.append(details);}section.append(n('p','地图适用版本 UNKNOWN；功能与关系来自人工地图。证据存在不等于职责已核实。','hint'));box.append(section);const changes=n('section',undefined,'panel');changes.append(n('h2','保存时的版本比较'));if(!r.handoff.baseRevision)changes.append(n('p','未选择比较基准；不能据此说没有变化。','hint'));for(const c of r.handoff.changes)changes.append(n('div',c.code+' · '+c.path,'file-row'));if(r.handoff.unmappedChanges?.length)changes.append(n('p','其中 '+r.handoff.unmappedChanges.length+' 个文件未匹配地图证据，需检查覆盖范围。','notice'));box.append(changes);const logs=n('section',undefined,'panel');logs.append(n('h2','日志依据 · 固定版本'));if(!r.logs.length)logs.append(n('p','没有选取日志。交接仍然可以使用，未记录不代表没有发生。','hint'));for(const l of r.logs){const detail=n('details');detail.append(n('summary',l.title+' · 第 '+l.version+' 版 · '+l.status),n('p',l.body,'copy-text'),n('p','保存时提交：'+l.codeRevision,'hint'));if(l.attachment){const f=l.attachment;detail.append(n('p','原件：'+f.name+' · '+(f.included?'本包已携带':'本包未携带，需另行取得'),'hint'));if(f.preview)detail.append(n('pre',f.preview,'copy-text'));if(f.included)detail.append(btn('查看 / 下载日志原件',()=>attachment(f),'quiet'));}logs.append(detail);}logs.append(n('p','快照不会随日志编辑自动改变，也不会回写原日志。关键决策分类不代表团队已批准。','hint'));box.append(logs);if(r.handoff.aiCandidates.length){const ai=n('section',undefined,'panel');ai.append(n('h2','已有 AI 解释 · 候选'));for(const c of r.handoff.aiCandidates)ai.append(n('p',c.explanation.summary,'copy-text'),n('p','未知项：'+c.explanation.unknowns.join('；'),'hint'));box.append(ai);}if(r.workspace){const w=n('details');w.append(n('summary','保存时工作区记录 · '+r.workspace.files.length+' 项'));for(const f of r.workspace.files)w.append(n('p',f.status+' · '+f.path,'hint'));if(r.workspace.diffIncluded)w.append(n('pre',r.workspace.diff));w.append(n('p',r.workspace.note,'hint'));box.append(w);}}
async function evidence(path){try{const data=await get('evidence',{id:selected.id,path});showDetail(path,n('pre',data.content+(data.truncated?'\n…内容已截断':'')));}catch(e){msg(e.message);}}
function showDetail(title,content){$('detail-title').textContent=title;$('detail-content').replaceChildren(content);$('detail').showModal();}
function rawBytes(encoded){return Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));}
function download(raw,name,type='application/json'){const url=URL.createObjectURL(new Blob([raw],{type}));const a=n('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function attachment(f){const raw=rawBytes(f.base64);const box=n('div');box.append(btn('下载原件',()=>download(raw,f.name,f.kind==='pdf'?'application/pdf':'application/octet-stream'),'primary'));if(f.kind==='pdf'){const url=URL.createObjectURL(new Blob([raw],{type:'application/pdf'}));urls.push(url);const frame=n('iframe',undefined,'pdf');frame.src=url;frame.title=f.name;box.append(frame);}else box.append(n('pre',f.preview||'请下载原件查看'));showDetail(f.name,box);}
function history(box){const section=n('section',undefined,'panel');section.append(n('h2','把这次工作交给下一位'),n('p','接续 JSON 可在另一台设备导入，包含任务、检查清单、日志快照和反馈。Markdown 与 AI 上下文便于阅读。','hint'));const bar=n('div',undefined,'export-bar');for(const [key,label] of [['json','下载接续 JSON'],['md','下载接续摘要'],['ai','复制给 AI'],['legacy','下载原格式交接包']])bar.append(btn(label,()=>exportRecord(key),key==='json'?'primary':''));section.append(bar);box.append(section);const h=n('section',undefined,'panel');h.append(n('h2','接续点修改历史'),n('p','正在读取…','hint'));box.append(h);const current=ticket;get('history',{id:selected.id}).then(d=>{if(current!==ticket)return;h.replaceChildren(n('h2','接续点修改历史'));for(const r of d.history){const row=n('div',undefined,'file-row');row.append(n('span','第 '+r.version+' 版 · '+stateLabels[r.state]+' · '+time(r.updatedAt)),btn('查看快照',()=>showDetail('第 '+r.version+' 版',n('pre',JSON.stringify({task:r.task,state:r.state,checklist:r.checklist,events:r.events},null,2))),'quiet'));h.append(row);}}).catch(e=>{if(current===ticket)h.append(n('p',e.message,'notice'));});if(selected.importedHistory?.length){const prior=n('details');prior.append(n('summary','导入前的 '+selected.importedHistory.length+' 项反馈（尚未本机核实）'));for(const e of selected.importedHistory)prior.append(n('p',e.actor+' · '+e.kind+'：'+e.note,'hint'));box.append(prior);}if(selected.parentId)box.append(n('p','沿用自接续点：'+selected.parentId+'。前一记录保留，不被覆盖。','hint'));}
async function exportRecord(kind){await lock(async()=>{const d=await get('export',{id:selected.id});const filename='projectmind-continuity-'+selected.id.slice(0,8);if(kind==='json')download(JSON.stringify(d.packet,null,2),filename+'.json');if(kind==='md')download(d.markdown,filename+'.md','text/markdown;charset=utf-8');if(kind==='legacy')download(JSON.stringify(d.legacyHandoff,null,2),filename+'-handoff.json');if(kind==='ai'){try{await navigator.clipboard.writeText(d.aiContext);msg('已复制接续上下文；没有调用模型');}catch(e){showDetail('手动复制给 AI',n('pre',d.aiContext));msg('浏览器未允许复制，文本已显示，可手动复制');}}});}
function field(label,id,type,value,wide=false){const l=n('label',label,'field'+(wide?' wide':''));const e=n(type==='textarea'?'textarea':'input');e.id=id;e.value=value||'';if(type!=='textarea')e.type=type;const limits={title:200,owner:100,goal:2000,completed:4000,stopPoint:4000,nextAction:2000,runInstructions:2000,acceptance:4000,cautions:2000};if(limits[id])e.maxLength=limits[id];l.append(e);return l;}
async function newRecord(){if(!leave())return;if(!config){try{config=await get('config');}catch(e){msg(e.message);return;}}selected=null;editing=true;dirty=false;ticket++;await editor();renderList();}
async function editRecord(){if(!leave())return;editing=true;dirty=false;ticket++;await editor();}
async function editor(){revoke();const r=selected;const main=$('main');main.replaceChildren(n('h1',r?'整理接续点':'保存当前工作接续点'),n('p','不是重写项目文档：明确停在哪里，让下一位能核查后继续。','sub'));const form=n('div',undefined,'form-grid');const task=r?.task||{};form.append(field('任务标题','title','text',task.title,true),field('要继续的目标','goal','textarea',task.goal),field('已经完成什么','completed','textarea',task.completed),field('工作停在哪里','stopPoint','textarea',task.stopPoint),field('接手第一步','nextAction','textarea',task.nextAction),field('如何运行 / 复现（仅保存文本）','runInstructions','textarea',task.runInstructions),field('怎样算完成 / 验证方法','acceptance','textarea',task.acceptance),field('注意事项 / 已尝试但不应重复的路线','cautions','textarea',task.cautions),field('发起记录者','owner','text',task.owner||$('actor').value));main.append(form);const checks=field('行动清单 · 每行一项，可在接手后填写结果','checklist-lines','textarea',r?r.checklist.map(c=>c.text).join('\n'):'',true);checks.querySelector('textarea').maxLength=10000;main.append(checks);const materials=n('section',undefined,'panel');materials.append(n('h2','带哪些材料'));const refresh=n('label',undefined,'choice'),capture=n('input');capture.type='checkbox';capture.id='recapture';capture.checked=!r;refresh.append(capture,n('span',r?'重新固定当前代码、比较结果和所选日志（旧版保留，重新回到准备状态）':'固定当前代码、工作区清单和所选日志'));materials.append(refresh);const source=r?.handoff.sourceLocator||config.defaultSource;materials.append(field('仓库来源地址或本机路径','source-value','text',source.value));const sourceKind=n('select');sourceKind.id='source-kind';for(const [value,label] of [['git_remote','Git 仓库地址'],['local_path','本机路径']]){const o=n('option',label);o.value=value;sourceKind.append(o);}sourceKind.value=source.kind;materials.append(sourceKind);const mode=n('select');mode.id='comparison-mode';for(const [value,label] of [['none','本次不进行提交比较'],['main','与本机已取得的 origin/main 比较'],['custom','指定完整基准提交']]){const o=n('option',label);o.value=value;mode.append(o);}materials.append(n('p','比较方式','hint'),mode,field('指定基准 SHA（仅指定比较时使用）','base-revision','text',''));const diff=n('label',undefined,'choice'),diffCheck=n('input');diffCheck.type='checkbox';diffCheck.id='include-diff';diff.append(diffCheck,n('span','携带未提交文本差异（最多 12,000 字符，可能含工作内容；不包含未跟踪原件）'));materials.append(diff);const ai=field('已有 AI 解释 JSON 列表（选填；只接受同一版本、同一次比较）','ai-candidates','textarea','');materials.append(ai);const scopes=n('details');scopes.append(n('summary','优先阅读的功能范围 · 不限制完整地图'));for(const item of config.nodes){const l=n('label',undefined,'choice'),c=n('input');c.type='checkbox';c.dataset.scope=item.id;c.checked=r?.scope.includes(item.id)||false;l.append(c,n('span',item.title));scopes.append(l);}materials.append(scopes);const logs=n('div',undefined,'log-list');logs.id='log-choices';logs.append(n('p','正在读取工作日志…','hint'));materials.append(n('h3','选择相关日志 · 保存选定版本'),logs);const include=n('label',undefined,'choice'),a=n('input');a.id='include-attachments';a.type='checkbox';include.append(a,n('span','携带所选日志的原始附件（单件最多 5 MB，总包最多 12 MB）'));materials.append(include,n('p','未携带原件时，会保留可读正文和“原件未携带”提示。不会修改工作日志。','hint'));main.append(materials);const buttons=n('div',undefined,'form-actions');buttons.append(btn('取消',()=>{if(!leave())return;editing=dirty=false;selected?render():empty();},'quiet'),btn(r?'保存接续点更新':'保存接续点',saveRecord,'primary'));main.append(buttons);main.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=()=>dirty=true);const current=ticket;try{const data=await get('logs');if(current!==ticket||!editing)return;logs.replaceChildren();for(const e of data.entries){const l=n('label',undefined,'choice log-item'),c=n('input');c.type='checkbox';c.dataset.logId=e.id;c.checked=r?.logs.some(old=>old.id===e.id)||false;c.onchange=()=>dirty=true;const body=n('span',e.title+' · 第 '+e.version+' 版');body.append(n('small',' · '+e.date+' · '+e.status));l.append(c,body);logs.append(l);}if(!data.entries.length)logs.append(n('p','暂无日志，可直接保存接续点。需要记录时打开顶部“工作日志”。','hint'));}catch(e){logs.replaceChildren(n('p',e.message,'notice'));}$('title').focus();}
async function saveRecord(){const task={};for(const key of ['title','goal','completed','stopPoint','nextAction','runInstructions','acceptance','cautions','owner'])task[key]=$(key).value;const lines=$('checklist-lines').value.split('\n').map(t=>t.trim()).filter(Boolean);const existing=selected?.checklist||[];const checklist=lines.map((text,i)=>{const old=existing.find(c=>c.text===text);return old?{...old}:{id:'check-'+Date.now()+'-'+i,text,state:'pending',note:'',evidence:''};});const scopes=[...document.querySelectorAll('[data-scope]:checked')].map(c=>c.dataset.scope);const data={task,checklist,scope:scopes};const recapture=$('recapture').checked;if(!selected||recapture){data.expectedRevision=config.revision;data.sourceLocator={kind:$('source-kind').value,value:$('source-value').value.trim()};const mode=$('comparison-mode').value;if(mode==='main')data.comparisonMode='main';if(mode==='custom')data.baseRevision=$('base-revision').value.trim();if($('ai-candidates').value.trim()){try{data.aiCandidates=JSON.parse($('ai-candidates').value);}catch(e){msg('AI 候选不是有效 JSON');return;}}data.logIds=[...document.querySelectorAll('[data-log-id]:checked')].map(c=>c.dataset.logId);data.includeAttachments=$('include-attachments').checked;data.includeWorktreeDiff=$('include-diff').checked;}if(selected)Object.assign(data,{id:selected.id,expectedVersion:selected.version});await lock(async()=>{selected=(await post(!selected?'create':recapture?'refresh_checkpoint':'update',data)).record;editing=dirty=false;tab='overview';await refreshList();render();msg('接续点已保存。准备好时到“接手与反馈”标记可交接。');});}
async function followup(){if(!leave())return;await lock(async()=>{config=await get('config');selected=(await post('followup',{id:selected.id,expectedVersion:selected.version,expectedRevision:config.revision})).record;editing=dirty=false;tab='overview';await refreshList();render();msg('已建立下一次接续点。请编辑新的停止位置、第一步和日志材料。');});}
$('new').onclick=newRecord;$('import').onclick=()=>{if(leave())$('import-file').click();};$('search').oninput=renderList;$('close-detail').onclick=()=>{$('detail').close();revoke();};
$('import-file').onchange=async()=>{const file=$('import-file').files[0];$('import-file').value='';if(!file||!leave())return;if(file.size>12*1024*1024||!file.size){msg('请选 1 字节至 12 MB 的交接 JSON');return;}await lock(async()=>{let uploadId;try{const start=await post('import_start',{filename:file.name,size:file.size});uploadId=start.uploadId;for(let offset=0;offset<file.size;offset+=start.chunkBytes){msg('正在接收文件 '+Math.round(offset/file.size*100)+'%');const chunk=new Uint8Array(await file.slice(offset,offset+start.chunkBytes).arrayBuffer());let binary='';for(const b of chunk)binary+=String.fromCharCode(b);await post('import_chunk',{uploadId,offset,base64:btoa(binary)});}selected=(await post('import_finish',{uploadId})).record;editing=dirty=false;ticket++;tab='receive';await refreshList();render();msg('已接收资料。请核对本机项目并记录接手结果。');}catch(e){if(uploadId)try{await post('import_cancel',{uploadId});}catch(_){}throw e;}});};
$('actor').value=sessionStorage.getItem('continuity-actor')||'';$('actor').oninput=()=>sessionStorage.setItem('continuity-actor',$('actor').value);window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
empty();Promise.all([get('config'),refreshList()]).then(([c])=>config=c).catch(e=>msg(e.message));
