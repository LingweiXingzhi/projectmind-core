<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Context Authority Inspector</title>
<style>
  body { font-family: Consolas, monospace; margin: 24px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 22px; border-bottom: 1px solid #ddd; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border: 1px solid #ddd; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #eee; }
  .ok { color: #0a7d32; } .warn { color: #b26a00; } .bad { color: #b21d1d; }
  .small { color: #666; font-size: 12px; }
  pre { background: #f0f0f0; padding: 8px; font-size: 12px; white-space: pre-wrap; }
  button { margin: 4px 6px 12px 0; padding: 4px 10px; }
</style>
</head>
<body>
<h1>Context Authority Inspector</h1>
<div class="small">派生视图 — 当前事实底座（不是需要人工维护的第二份真源）。registry hash: <span id="hash">…</span></div>
<button onclick="load('state')">CURRENT</button>
<button onclick="load('conflicts')">CONFLICTS</button>
<button onclick="load('claims')">RAW CLAIMS</button>
<div id="out">loading…</div>
<script>
async function load(action) {
  const out = document.getElementById("out");
  out.textContent = "loading…";
  try {
    const res = await fetch(`/api/extensions/context_authority?action=${action}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    if (action === "state" || action === undefined) return renderState(data);
    if (action === "conflicts") return renderConflicts(data);
    out.replaceChildren(element("pre", JSON.stringify(data, null, 2)));
  } catch (error) {
    out.textContent = `Context Authority unavailable: ${error.message}`;
  }
}
function element(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}
function details(row, title) {
  const node = element("details");
  node.append(element("summary", title), element("pre", JSON.stringify(row, null, 2)));
  return node;
}
function renderState(s) {
  document.getElementById("hash").textContent = s.registry_hash || "";
  const out = document.getElementById("out");
  out.replaceChildren(element("h2", "CURRENT PROJECT STATE"));
  const table = element("table");
  const header = element("tr");
  for (const title of ["key / scope", "value", "type", "evidence"]) header.append(element("th", title));
  table.append(header);
  const rows = s.current_by_scope || Object.entries(s.current || {}).map(([key, value]) => ({key, ...value}));
  for (const row of rows) {
    const tr = element("tr");
    tr.append(element("td", `${row.key} / ${row.scope}`), element("td", JSON.stringify(row.value)), element("td", row.type));
    const td = element("td");
    td.append(details(row, (row.claim_ids || []).join(", ")));
    tr.append(td);
    table.append(tr);
  }
  out.append(table);
  for (const [field, title] of [["conflicts", "CONFLICTS — HUMAN_REQUIRED"], ["registry_problems", "REGISTRY PROBLEMS — HUMAN_REQUIRED"], ["stale", "STALE / SUPERSEDED"], ["proposals", "PROPOSALS"], ["research", "RESEARCH"], ["historical", "HISTORICAL"], ["verification_unavailable", "VERIFICATION UNAVAILABLE"]]) {
    const items = s[field] || [];
    const heading = element("h2", `${title}: ${items.length}`);
    heading.className = items.length && ["conflicts", "registry_problems"].includes(field) ? "bad" : "warn";
    out.append(heading);
    for (const row of items) out.append(details(row, `${row.key || row.kind || ""} / ${row.scope || ""} ${row.claim_id || ""}`));
  }
}
function renderConflicts(c) {
  document.getElementById("out").replaceChildren(element("h2", `Conflicts: ${(c.conflicts || []).length} — HUMAN_REQUIRED`), element("pre", JSON.stringify(c.conflicts || [], null, 2)));
}
load("state");
</script>
</body>
</html>
