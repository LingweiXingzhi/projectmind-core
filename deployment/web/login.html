<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 ProjectMind</title>
<style>body{margin:0;background:#f4f6fa;font:16px system-ui;color:#172238}main{max-width:360px;margin:14vh auto;background:white;padding:32px;border-radius:16px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c3d5;border-radius:8px}button{background:#2157d5;color:white;font:inherit;cursor:pointer}#error{color:#b42318}</style>
<script src="/login.js" defer></script></head><body><main><h1>ProjectMind</h1><p>登录团队工作台</p><form id="login"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="error" role="alert"></p></form></main></body></html>
